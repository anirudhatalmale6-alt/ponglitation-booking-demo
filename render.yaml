# Render Blueprint — one-click deploy for the PongLiTation booking engine.
# Deploy via: render.com → New + → Blueprint → connect this public repo.
services:
  - type: web
    name: ponglitation
    env: node
    plan: starter          # always-on (no cold starts)
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    # Permanent storage: bookings + generated emails live here, so they
    # survive restarts and redeploys instead of being wiped.
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
